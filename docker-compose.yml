version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: insurance_dw_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dw_pass}
      POSTGRES_DB: ${POSTGRES_DB:-insurance_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dw_user} -d ${POSTGRES_DB:-insurance_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
